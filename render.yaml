services:
  - type: web
    name: vi-xinh-web
    env: python
    region: singapore
    plan: free
    branch: main
    rootDir: phase-1-web-demo
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn run:app --bind 0.0.0.0:$PORT --workers 2 --threads 4 --timeout 120
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.12
      - key: GOOGLE_VISION_API_KEY
        sync: false
