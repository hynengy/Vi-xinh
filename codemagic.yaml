workflows:
  ios-release:
    name: Build iOS App (.ipa)
    instance_type: mac_mini_m1
    max_build_duration: 45
    working_directory: phase-2-mobile-app
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Get Flutter dependencies
        script: |
          flutter pub get
      - name: Build iOS Application
        script: |
          flutter build ios --release --no-codesign
      - name: Package into Installable IPA (for Sideloadly / AltStore / Test)
        script: |
          cd build/ios/iphoneos
          mkdir -p Payload
          cp -r Runner.app Payload/
          zip -qr Vi-Xinh.ipa Payload
    artifacts:
      - phase-2-mobile-app/build/ios/iphoneos/Vi-Xinh.ipa
      - "**/Vi-Xinh.ipa"
      - "**/*.ipa"
    publishing:
      email:
        recipients:
          - nguyenthuyhien22092005@gmail.com
        notify:
          success: true
          failure: true
